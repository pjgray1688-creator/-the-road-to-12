<!doctype html>
<html lang="en">
  <body style="margin:0;background:#070a0d;color:#f7f8fa;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#070a0d;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#11161a;border:1px solid #293139;border-radius:16px;padding:32px">
          <tr><td>
            <p style="margin:0 0 12px;color:#b7ff3c;font-size:13px;font-weight:800;letter-spacing:.12em">R12 ACCOUNT SECURITY</p>
            <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2">Reset your password</h1>
            <p style="margin:0 0 24px;color:#c5cbd0;line-height:1.6">Use the secure button below to continue. Your password will not be changed until you open the page and confirm the reset yourself.</p>
            <a href="{{ .SiteURL }}/account/reset?token_hash={{ .TokenHash }}&amp;type=recovery&amp;redirect_to={{ .RedirectTo | urlquery }}" style="display:inline-block;background:#b7ff3c;color:#09090c;text-decoration:none;font-weight:800;padding:14px 20px;border-radius:10px">Continue to reset password</a>
            <p style="margin:24px 0 0;color:#8f989f;font-size:13px;line-height:1.5">If you did not request this, you can safely ignore this email.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
