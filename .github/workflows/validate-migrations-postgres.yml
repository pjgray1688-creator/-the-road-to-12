name: Validate R12 migrations in isolated PostgreSQL

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'package.json'
      - '.github/workflows/validate-migrations-postgres.yml'

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: r12_ci
          POSTGRES_PASSWORD: r12_ci_only
          POSTGRES_DB: r12_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r12_ci -d r12_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: r12_ci
      PGPASSWORD: r12_ci_only
      PGDATABASE: r12_ci
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap isolated Supabase platform primitives
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          -- Supabase-managed roles are platform primitives only.  They are
          -- NOLOGIN roles with no extra privileges in this disposable CI DB;
          -- migrations need them solely as GRANT/REVOKE and RLS subjects.
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin; end if;
          end $$;
          create table auth.users (id uuid primary key);
          alter table auth.users add column email text;
          create function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          SQL

      - name: Apply dependency-complete R12 Club chain
        run: |
          set -euo pipefail
          # The 2026-08-30..2026-09-02 files are patches against legacy
          # workout/profile tables that predate this repository.  Replaying
          # them from an empty database is not a truthful production baseline
          # (for example, whoop_connections is expected to pre-exist).  The
          # Club foundation is the first complete schema creator available;
          # apply that real Club chain in dependency order instead.
          migrations=(
            supabase/migrations/2026-09-03-club-foundation.sql
            supabase/migrations/2026-09-03-club-branding.sql
            supabase/migrations/2026-09-04-club-product-entitlements.sql
            supabase/migrations/2026-09-05-club-transactional-rpcs.sql
            supabase/migrations/2026-09-06-club-authenticated-table-privileges.sql
            supabase/migrations/2026-09-06-club-staff-access-grants.sql
            supabase/migrations/2026-09-07-club-classes-bookings-services.sql
            # 2026-09-08 is the real origin of club_save_commerce_product;
            # 2026-09-20 is its brand-column patch and must follow it.
            supabase/migrations/2026-09-08-club-commerce-payments-inventory.sql
            supabase/migrations/2026-09-09-club-cash-credits-promotions.sql
            supabase/migrations/2026-09-10-club-membership-access.sql
            supabase/migrations/2026-09-11-club-induction.sql
            supabase/migrations/2026-09-12-club-membership-lifecycle.sql
            supabase/migrations/2026-09-13-club-staff-capabilities-audit.sql
            supabase/migrations/2026-09-18-club-delivery-pricing.sql
            supabase/migrations/2026-09-19-club-member-account-identity.sql
            supabase/migrations/2026-09-20-club-commerce-product-brand.sql
            supabase/migrations/2026-09-22-club-supplier-commerce.sql
            supabase/migrations/2026-09-23-club-supplier-capabilities.sql
            supabase/migrations/2026-09-24-club-supplier-catalogue-operations.sql
            supabase/migrations/2026-09-25-club-madhouse-balance.sql
            supabase/migrations/2026-09-26-club-supplier-cycles.sql
            supabase/migrations/2026-09-27-club-payment-attempts-split-tender.sql
            supabase/migrations/2026-09-28-club-membership-billing-dunning.sql
            supabase/migrations/2026-09-29-club-shelf-removals-discounts.sql
            supabase/migrations/2026-09-30-club-member-import.sql
            supabase/migrations/2026-10-01-club-promotions-engine.sql
            supabase/migrations/2026-10-04-club-stock-replenishment.sql
          )
          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
            if [ "${migration}" = "supabase/migrations/2026-10-01-club-promotions-engine.sql" ]; then
              echo "PROMOTIONS_MIGRATION_EXECUTED_SUCCESSFULLY"
            fi
          done

      - name: Verify promotions catalogue objects
        run: |
          psql -v ON_ERROR_STOP=1 -X <<'SQL'
          select to_regclass('public.club_promotion_applied_orders') is not null as applied_orders;
          select to_regclass('public.club_golden_ticket_redemptions') is not null as golden_ticket_redemptions;
          select to_regprocedure('public.club_apply_promotion_stack(jsonb,jsonb,integer)') is not null as stack_function;
          select to_regprocedure('public.club_evaluate_commerce_promotions(uuid,uuid,uuid,uuid,jsonb,text)') is not null as evaluator_function;
          select to_regprocedure('public.club_finalize_paid_order(uuid,uuid)') is not null as finaliser_function;
          select to_regprocedure('public.club_consume_golden_ticket(uuid,uuid,uuid,uuid,uuid,jsonb,integer,date)') is not null as golden_ticket_function;
          do $$
          begin
            if to_regclass('public.club_promotion_applied_orders') is null
              or to_regclass('public.club_golden_ticket_redemptions') is null
              or to_regprocedure('public.club_apply_promotion_stack(jsonb,jsonb,integer)') is null
              or to_regprocedure('public.club_evaluate_commerce_promotions(uuid,uuid,uuid,uuid,jsonb,text)') is null
              or to_regprocedure('public.club_finalize_paid_order(uuid,uuid)') is null
              or to_regprocedure('public.club_consume_golden_ticket(uuid,uuid,uuid,uuid,uuid,jsonb,integer,date)') is null then
              raise exception 'Promotions catalogue verification failed';
            end if;
          end $$;
          SQL

      - name: Run application regression checks
        run: |
          npm ci
          npm test
          npm run build
          npm run lint
          git diff --check
